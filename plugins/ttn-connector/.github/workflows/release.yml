name: CD - Package & Release Plugin

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x

      - name: Install dependencies
        run: npm ci

      - name: Build plugin bundle
        run: npm run build

      - name: Run unit tests
        run: npm test

      - name: Package Plugin Archive
        id: pack
        run: |
          mkdir -p releases
          ZIP_NAME="plugin-${GITHUB_REPOSITORY#*/}-${GITHUB_REF_NAME}.zip"
          zip -r "releases/${ZIP_NAME}" manifest.json package.json dist/ README.md
          echo "zip_path=releases/${ZIP_NAME}" >> $GITHUB_OUTPUT
          echo "zip_name=${ZIP_NAME}" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.pack.outputs.zip_path }}
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
